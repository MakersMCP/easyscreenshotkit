name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu 22.04 with its ffmpeg 4.4.2, the oldest the kit supports,
    # Ubuntu 24.04 with its ffmpeg 6.1, and ubuntu-latest, the newest Ubuntu
    # GitHub runs. Each comes with Google Chrome. Node.js 22 is the oldest
    # the kit takes, and the tests run on Node.js 24 too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Ubuntu 24.04 and later block the user namespaces Chrome's sandbox
      # needs; 22.04 has no such setting.
      # Where the runner hands a crashed process's core to a program, as
      # Ubuntu's apport, Chrome learns that a tab crashed only once that
      # program is done with it, and the tests of a crashed tab wait past
      # their time. The runner keeps no core files (ulimit -c is 0), so the
      # core then goes nowhere. The step prints what it found.
      - name: Let Chrome start
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern), ulimit -c: $(ulimit -c)"
          if grep -q '^|' /proc/sys/kernel/core_pattern; then sudo sysctl -w kernel.core_pattern=core; fi
      # The demo tests encode with ffmpeg; without it they are skipped.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - run: npm test
